name: Image
# main 머지마다 이미지를 만들어 비공개 ECR <계정>.dkr.ecr.ap-northeast-2.amazonaws.com/dudoong-front:dev 를 덮어쓴다(deploy-plan §5).
# 스테이징 compose가 :dev를 쓴다. 버전 태그는 release.yml이 붙인다.
# 푸시 역할(Deploy infra/ecr.yml FrontV2PushRole)의 신뢰 조건은 refs/heads/main과 refs/tags/v* 뿐이다.
# 수동 실행(workflow_dispatch)도 main에서만 된다 — 다른 브랜치를 고르면 역할을 받지 못하므로 첫 단계에서 멈춘다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC → dudoong-github-ecr-front-v2

# :dev 하나만 덮어쓰므로 한 번에 하나씩 돈다. 대기 중인 실행은 더 새 실행으로 바뀌고(중간 커밋은 이미지가 없을 수 있다 —
# 그 커밋에 버전 태그를 달면 release.yml이 새로 빌드한다), 도는 실행은 끝까지 간다 → 마지막에 끝나는 것이 main 최신이다.
concurrency:
  group: image-dev
  cancel-in-progress: false

jobs:
  build:
    # 서버가 ARM(t4g)이라 arm64만, ARM 러너에서 네이티브로 빌드한다.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: main에서만
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::image.yml은 main에서만 돈다(ECR 푸시 역할 신뢰 조건: refs/heads/main, refs/tags/v*). 지금 ref: ${GITHUB_REF}"
          exit 1
      - name: 빌드 인자 확인
        env:
          KAKAO: ${{ vars.NEXT_PUBLIC_KAKAO_JS_KEY }}
        run: |
          [ -n "$KAKAO" ] || { echo "::error::저장소 variable NEXT_PUBLIC_KAKAO_JS_KEY가 없다(next build가 요구한다)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-ecr-front-v2
          aws-region: ap-northeast-2
          mask-aws-account-id: true
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/dudoong-front
          # sha 태그는 만들지 않는다 — ECR 수명 정책이 태그 이미지를 10개만 남겨 운영 버전이 밀려난다(deploy-plan §1).
          # org.opencontainers.image.revision 라벨(= 커밋)은 metadata-action이 붙인다. release.yml이 이 라벨로 :dev 승격을 판단한다.
          tags: type=raw,value=dev
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_KAKAO_JS_KEY=${{ vars.NEXT_PUBLIC_KAKAO_JS_KEY }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
