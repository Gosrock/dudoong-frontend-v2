name: Release tag
# v2.x.y 태그 → 비공개 ECR dudoong-front:2.x.y (deploy-plan §5).
# :dev의 org.opencontainers.image.revision 라벨이 태그 커밋과 같으면 다시 빌드하지 않고 그 이미지에 버전 태그만 붙인다
# (스테이징에서 본 이미지를 그대로 승격). 다르면 태그 커밋으로 빌드한다. 버전 태그는 ECR에서 덮어쓸 수 없다.
# 승격하려면 그 커밋의 Image 워크플로(main → :dev)가 끝난 뒤에 태그를 푸시한다.
# v* 태그는 저장소 태그 ruleset으로 관리자만 만든다 — 푸시 역할이 refs/tags/v*를 믿기 때문이다.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # GitHub OIDC → dudoong-github-ecr-front-v2

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # 빌드할 수도 있어서 arm64 러너에서 돈다(image.yml과 같다).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-ecr-front-v2
          aws-region: ap-northeast-2
          mask-aws-account-id: true
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - id: plan
        name: 승격할지 빌드할지
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/dudoong-front
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # 이미지 설정의 라벨에서 커밋을 읽는다. 단일/멀티 플랫폼 출력 모양이 달라 Labels를 재귀로 찾는다.
          revision() {
            { docker buildx imagetools inspect --format '{{json .Image}}' "$1" 2> /dev/null || true; } \
              | jq -r '[.. | objects | .Labels? // empty | objects | .["org.opencontainers.image.revision"] // empty] | unique | join(" ")'
          }
          # 같은 버전 태그가 이미 있으면(재실행) 커밋이 같을 때만 성공으로 끝낸다.
          if docker buildx imagetools inspect "${REPO}:${version}" > /dev/null 2>&1; then
            existing="$(revision "${REPO}:${version}")"
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "이미 있음: ${version} (${GITHUB_SHA::7})"; echo "mode=done" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::${version} 태그가 다른 커밋(${existing:-알 수 없음})으로 이미 있다 — 버전 태그는 덮어쓸 수 없다"; exit 1
          fi
          # :dev가 도중에 덮어써져도 같은 이미지를 보도록 digest로 고정한다.
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${REPO}:dev" 2> /dev/null || true)"
          dev_rev=""
          [ -n "$digest" ] && dev_rev="$(revision "${REPO}@${digest}")"
          if [ "$dev_rev" = "$GITHUB_SHA" ]; then
            echo "mode=promote" >> "$GITHUB_OUTPUT"; echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo ":dev(${digest})가 ${GITHUB_SHA::7} 이미지다 — 태그만 붙인다"
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo ":dev는 ${dev_rev:-없음} — ${GITHUB_SHA::7}로 새로 빌드한다"
          fi

      - name: ':dev 승격'
        if: steps.plan.outputs.mode == 'promote'
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/dudoong-front
          VERSION: ${{ steps.plan.outputs.version }}
          DIGEST: ${{ steps.plan.outputs.digest }}
        run: docker buildx imagetools create --tag "${REPO}:${VERSION}" "${REPO}@${DIGEST}"

      - name: 빌드 인자 확인
        if: steps.plan.outputs.mode == 'build'
        env:
          KAKAO: ${{ vars.NEXT_PUBLIC_KAKAO_JS_KEY }}
        run: |
          [ -n "$KAKAO" ] || { echo "::error::저장소 variable NEXT_PUBLIC_KAKAO_JS_KEY가 없다(next build가 요구한다)"; exit 1; }
      - if: steps.plan.outputs.mode == 'build'
        uses: actions/checkout@v4
      - id: meta
        if: steps.plan.outputs.mode == 'build'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/dudoong-front
          tags: type=raw,value=${{ steps.plan.outputs.version }}
      - if: steps.plan.outputs.mode == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_KAKAO_JS_KEY=${{ vars.NEXT_PUBLIC_KAKAO_JS_KEY }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
