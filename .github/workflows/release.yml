name: Release tag
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  retag:
    # 다시 빌드하지 않고 main에서 만든 같은 이미지에 버전 태그만 붙인다(deploy-plan §5).
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag existing image
        run: |
          short="${GITHUB_SHA::7}"
          version="${GITHUB_REF_NAME#v}"
          src="ghcr.io/gosrock/dudoong-front:sha-${short}"
          docker buildx imagetools inspect "$src" > /dev/null || { echo "이 커밋의 이미지가 없다: $src"; exit 1; }
          docker buildx imagetools create -t "ghcr.io/gosrock/dudoong-front:${version}" "$src"
