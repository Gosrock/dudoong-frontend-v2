    <script>
      (function () {
// 플러그인 메인 스레드(code.js)와 UI(ui.html)가 같이 쓰는 순수 로직. build.mjs가 두 파일에 그대로 넣는다.
// Figma 메인 스레드에 들어가므로 `?.`·`??`·객체 spread를 쓰지 않는다.

const REPO = { owner: 'Gosrock', name: 'dudoong-frontend-v2' };

/** 트래킹 대상 파일. 여기 없는 파일(테스트 파일)에서 만든 이슈는 테스트 라벨이 붙는다. */
const KNOWN_FILES = {
  '1Cn4WOu6TDaSajbFIuH6fO': { short: 'GUI', label: 'Figma: GUI' },
  FUQb8ldGBp3uYUuXPV5FDC: { short: '와이어', label: 'Figma: 와이어프레임' },
  '0QD9tGSt8ZciDqe7ol2gYH': { short: 'DS', label: 'Figma: 디자인 시스템' },
};

const CHANGE_TYPES = [
  {
    id: 'update',
    label: '수정',
    short: '수정',
    hint: '있던 화면의 문구·간격·색·배치를 바꿨을 때',
    githubLabel: 'Design: 수정',
  },
  {
    id: 'new',
    label: '신규 화면',
    short: '새 화면',
    hint: '없던 화면(프레임)을 새로 그렸을 때',
    githubLabel: 'Design: 신규 화면',
  },
  {
    id: 'ready',
    label: 'Ready for dev 전환',
    short: 'Ready for dev',
    hint: '작업이 끝나 개발해도 될 때(Dev Mode Ready for dev와 같은 뜻)',
    githubLabel: 'Design: Ready for dev',
  },
  {
    id: 'ds',
    label: '디자인 시스템 변경(토큰·컴포넌트)',
    short: '디자인 시스템',
    hint: '토큰(색·간격·글꼴)이나 공용 컴포넌트를 바꿨을 때',
    githubLabel: 'Design: 디자인 시스템',
  },
  {
    id: 'delete',
    label: '삭제',
    short: '삭제',
    hint: '화면을 없앨 때 — 지우기 전에 골라서 보내 주세요',
    githubLabel: 'Design: 삭제',
  },
];

const SYNC_LABEL = 'Design Sync';
const TEST_LABEL = 'Test: figma-plugin';

/** 저장소에 만들 라벨(sync-labels.mjs). 이름은 기존 `Type:`·`For:`·`Status:` 체계를 따른다. */
const LABELS = [
  {
    name: SYNC_LABEL,
    color: '7E57C2',
    description: '[디자인] Figma 플러그인으로 들어온 디자인 변경',
  },
]
  .concat(
    CHANGE_TYPES.map((t) => ({
      name: t.githubLabel,
      color: 'C5B3F6',
      description: `[디자인 변경 유형] ${t.label}`,
    })),
  )
  .concat(
    Object.keys(KNOWN_FILES).map((key) => ({
      name: KNOWN_FILES[key].label,
      color: 'BFD4F2',
      description: `[디자인 파일] ${KNOWN_FILES[key].short} (${key})`,
    })),
  )
  .concat([
    {
      name: TEST_LABEL,
      color: 'EDEDED',
      description: '[테스트] 플러그인 시험용 이슈 — 닫아도 된다',
    },
  ]);

const DEV_STATUS_TEXT = { READY_FOR_DEV: 'Ready for dev', COMPLETED: 'Completed' };

function devStatusText(status) {
  return status ? DEV_STATUS_TEXT[status] || status : '—';
}

function isKnownFile(fileKey) {
  return Object.prototype.hasOwnProperty.call(KNOWN_FILES, fileKey);
}

/** Figma 링크(공유 링크·브라우저 주소)에서 fileKey를 꺼낸다. */
function parseFileKey(url) {
  const m = /figma\.com\/(?:file|design|proto|board|slides)\/([A-Za-z0-9]+)/.exec(url || '');
  return m ? m[1] : null;
}

function nodeUrl(fileKey, nodeId) {
  return `https://www.figma.com/design/${fileKey}/?node-id=${encodeURIComponent(nodeId.replace(/:/g, '-'))}`;
}

function marker(fileKey, nodeId) {
  return `\x3C!-- figma-node:${fileKey}/${nodeId} -->`;
}

/** 이슈 본문의 마커 → `fileKey/nodeId` 목록 */
function parseMarkers(text) {
  const out = [];
  const re = /\x3C!-- figma-node:([A-Za-z0-9]+\/[^\s>]+) -->/g;
  let m;
  while ((m = re.exec(text || '')) !== null) out.push(m[1]);
  return out;
}

/**
 * 고른 레이어를 "트래킹 단위"로 올린다: 페이지·섹션 바로 아래 노드(화면 프레임),
 * 컴포넌트는 그 자체, variant는 컴포넌트 세트.
 * node는 Figma 노드 또는 { type, parent } 모양의 객체.
 */
function resolveTarget(node) {
  let cur = node;
  while (cur.parent && cur.parent.type !== 'PAGE' && cur.parent.type !== 'SECTION') {
    if (cur.type === 'COMPONENT_SET') return cur;
    if (cur.type === 'COMPONENT' && cur.parent.type !== 'COMPONENT_SET') return cur;
    cur = cur.parent;
  }
  return cur;
}

/** 바깥 섹션부터의 섹션 이름 경로 */
function sectionPath(node) {
  const names = [];
  let cur = node.parent;
  while (cur && cur.type !== 'PAGE' && cur.type !== 'DOCUMENT') {
    if (cur.type === 'SECTION') names.unshift(cur.name);
    cur = cur.parent;
  }
  return names;
}

const DS_FILE = '0QD9tGSt8ZciDqe7ol2gYH';

/** 기본 변경 유형: 모두 Ready for dev → ready, 디자인 시스템 파일 → ds, 그 밖 → update */
function suggestType(targets, fileKey) {
  if (targets.length > 0 && targets.every((t) => t.devStatus === 'READY_FOR_DEV')) return 'ready';
  if (fileKey === DS_FILE) return 'ds';
  return 'update';
}

/** 변경 내용의 첫 줄 → 이슈 제목에 붙는 요약(길면 자른다) */
function summaryOf(text, max) {
  const limit = max || 40;
  const first = (text || '').trim().split(/\r?\n/)[0].trim();
  return first.length > limit ? `${first.slice(0, limit - 1)}…` : first;
}

function changeType(id) {
  const t = CHANGE_TYPES.find((c) => c.id === id);
  if (!t) throw new Error(`알 수 없는 변경 유형: ${id}`);
  return t;
}

function escapeCell(text) {
  return String(text).replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');
}

function framesTable(fileKey, targets) {
  const rows = targets.map((t) => {
    const where = t.sections && t.sections.length ? t.sections.join(' › ') : '—';
    return `| [${escapeCell(t.name)}](${nodeUrl(fileKey, t.id)}) | \`${t.id}\` | ${t.type} | ${escapeCell(where)} | ${devStatusText(t.devStatus)} |`;
  });
  return ['| 프레임 | 노드 | 종류 | 섹션 | Dev Mode |', '|---|---|---|---|---|']
    .concat(rows)
    .join('\n');
}

function titleTargets(targets) {
  const first = targets[0].name;
  return targets.length > 1 ? `${first} 외 ${targets.length - 1}` : first;
}

/**
 * ctx: { fileKey, fileName, pageName, targets[{id,name,type,devStatus,sections}], typeId, summary, description, author }
 */
function buildIssue(ctx) {
  if (!ctx.targets.length) throw new Error('프레임을 하나 이상 골라야 한다');
  const type = changeType(ctx.typeId);
  const known = isKnownFile(ctx.fileKey);
  const fileShort = known ? KNOWN_FILES[ctx.fileKey].short : '테스트';
  const summary = ctx.summary.trim();
  const title = `[디자인·${fileShort}] ${titleTargets(ctx.targets)}${summary ? ` — ${summary}` : ''}`;

  const labels = [
    SYNC_LABEL,
    type.githubLabel,
    known ? KNOWN_FILES[ctx.fileKey].label : TEST_LABEL,
  ];

  const body = [
    `> Figma 플러그인으로 작성 · 작성자 **${ctx.author || '알 수 없음'}**`,
    '',
    `**변경 유형** ${type.label}  `,
    `**파일** ${ctx.fileName} (\`${ctx.fileKey}\`) · **페이지** ${ctx.pageName}`,
    '',
    '### 프레임',
    framesTable(ctx.fileKey, ctx.targets),
    '',
    '### 변경 내용',
    ctx.description.trim() || '_(내용 없음)_',
    '',
    ctx.targets.map((t) => marker(ctx.fileKey, t.id)).join('\n'),
  ].join('\n');

  return { title, body, labels };
}

/** 열린 이슈에 이어 쓰는 댓글. 이슈 본문에 없는 프레임은 newMarkers로 돌려준다(본문에 덧붙인다). */
function buildComment(ctx, issueBody) {
  if (!ctx.targets.length) throw new Error('프레임을 하나 이상 골라야 한다');
  const type = changeType(ctx.typeId);
  const existing = parseMarkers(issueBody);
  const newMarkers = ctx.targets
    .filter((t) => existing.indexOf(`${ctx.fileKey}/${t.id}`) === -1)
    .map((t) => marker(ctx.fileKey, t.id));
  const summary = ctx.summary.trim();
  const body = [
    `### 디자인 변경 — ${type.label}${summary ? ` · ${summary}` : ''}`,
    `> Figma 플러그인으로 작성 · 작성자 **${ctx.author || '알 수 없음'}** · 페이지 ${ctx.pageName}`,
    '',
    framesTable(ctx.fileKey, ctx.targets),
    '',
    ctx.description.trim() || '_(내용 없음)_',
  ].join('\n');
  return { body, newMarkers, label: type.githubLabel };
}

/**
 * 이슈 목록(GitHub REST 응답)에서 고른 노드가 들어 있는 것만 고른다. 열린 것 먼저, 최근 것 먼저.
 * 반환: [{ number, title, state, url, createdAt, author, nodeIds }]
 */
function matchIssues(issues, fileKey, nodeIds) {
  const wanted = nodeIds.map((id) => `${fileKey}/${id}`);
  return issues
    .filter((i) => !i.pull_request)
    .map((i) => {
      const hits = parseMarkers(i.body).filter((k) => wanted.indexOf(k) !== -1);
      return {
        number: i.number,
        title: i.title,
        state: i.state,
        url: i.html_url,
        createdAt: i.created_at,
        author: i.user ? i.user.login : '',
        nodeIds: hits.map((k) => k.slice(fileKey.length + 1)),
      };
    })
    .filter((i) => i.nodeIds.length > 0)
    .sort((a, b) => {
      if (a.state !== b.state) return a.state === 'open' ? -1 : 1;
      return a.createdAt < b.createdAt ? 1 : -1;
    });
}

/** fine-grained PAT 발급 페이지(미리 채움). 저장소는 문서상 미리 고를 수 없어 디자이너가 고른다. now는 테스트용 */
function tokenUrl(now) {
  // 토큰 이름은 계정 안에서 겹치면 안 된다 — 다시 발급할 때(만료·분실) 막히지 않게 발급 시각을 붙인다
  const d = now || new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const params = [
    ['name', `DuDoong Figma 트래커 ${stamp}`],
    ['description', `Figma 플러그인에서 ${REPO.owner}/${REPO.name} 이슈 작성용`],
    ['target_name', REPO.owner],
    ['expires_in', '366'],
    ['issues', 'write'],
  ];
  return `https://github.com/settings/personal-access-tokens/new?${params
    .map((p) => `${p[0]}=${encodeURIComponent(p[1])}`)
    .join('&')}`;
}

// 플러그인 UI(iframe). build.mjs가 core.mjs와 함께 plugin/ui.html에 넣는다.
// iframe origin이 null이라 Access-Control-Allow-Origin: * 인 api.github.com만 부른다.
// 디자이너가 쓰는 칸은 "무엇이 바뀌었나요?" 하나 — 제목은 첫 줄, 유형·보낼 곳은 자동으로 고르고 바꿀 수만 있다.
/* global REPO, CHANGE_TYPES, SYNC_LABEL, buildIssue, buildComment, matchIssues, devStatusText, isKnownFile, parseFileKey, suggestType, summaryOf, tokenUrl */

const API = 'https://api.github.com';
const MAX_ISSUE_PAGES = 5; // 100개씩, 최근 500개까지

const state = {
  token: null,
  login: null,
  fileKey: null,
  fileName: '',
  author: null,
  pageName: '',
  targets: [],
  issues: [],
  issuesLoaded: false,
  issuesError: null,
  typeId: 'update',
  typeTouched: false,
  forceNew: false, // 열린 이슈가 있어도 새 이슈로
  busy: false,
  result: null, // { url, text }
  error: null,
};

// ── GitHub ──

class GitHubError extends Error {
  constructor(status, message) {
    super(message);
    this.status = status;
  }
}

async function gh(path, options) {
  const opts = options || {};
  const res = await fetch(API + path, {
    method: opts.method || 'GET',
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${opts.token || state.token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    let detail = '';
    try {
      detail = (await res.json()).message || '';
    } catch {
      // 본문 없음
    }
    throw new GitHubError(res.status, explain(res.status, detail));
  }
  return res.status === 204 ? null : res.json();
}

function explain(status, detail) {
  switch (status) {
    case 401:
      return '토큰이 맞지 않거나 만료됐어요. 다시 연결해 주세요.';
    case 403:
      return `권한이 없어요. 토큰이 조직 승인 대기 중이거나, 저장소 ${REPO.name}를 고르지 않았거나, Issues 쓰기 권한이 없을 수 있어요. (${detail})`;
    case 404:
      return `저장소를 찾을 수 없어요. 토큰에 ${REPO.owner}/${REPO.name}를 골랐는지 확인해 주세요.`;
    case 422:
      return `GitHub가 요청을 거절했어요: ${detail}`;
    default:
      return `GitHub 오류 ${status}: ${detail}`;
  }
}

const repoPath = `/repos/${REPO.owner}/${REPO.name}`;

async function loadIssues() {
  state.issuesError = null;
  const all = [];
  try {
    for (let page = 1; page <= MAX_ISSUE_PAGES; page++) {
      const batch = await gh(
        `${repoPath}/issues?labels=${encodeURIComponent(SYNC_LABEL)}&state=all&per_page=100&page=${page}`,
      );
      all.push(...batch);
      if (batch.length < 100) break;
    }
    state.issues = all;
    state.issuesLoaded = true;
  } catch (e) {
    state.issuesError = e.message;
  }
  render();
}

// ── Figma ↔ UI ──

function post(msg) {
  parent.postMessage({ pluginMessage: msg }, '*');
}

function openUrl(url) {
  post({ type: 'open-url', url });
}

window.onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'init') {
    Object.assign(state, {
      token: msg.token,
      fileKey: msg.fileKey,
      fileName: msg.fileName,
      author: msg.author,
      pageName: msg.pageName,
    });
    setTargets(msg.targets);
    if (state.token) connect(state.token, { silent: true });
  } else if (msg.type === 'selection') {
    state.pageName = msg.pageName;
    setTargets(msg.targets);
  }
  render();
};

function setTargets(targets) {
  state.targets = targets;
  state.result = null;
  state.error = null;
  state.forceNew = false;
  if (!state.typeTouched) state.typeId = suggestType(targets, state.fileKey);
}

async function connect(token, opts) {
  state.busy = true;
  state.error = null;
  render();
  try {
    const user = await gh('/user', { token });
    state.token = token;
    state.login = user.login;
    if (!(opts && opts.silent)) post({ type: 'save-token', token });
    loadIssues();
  } catch (e) {
    state.token = null;
    state.login = null;
    state.error = e.message;
  }
  state.busy = false;
  render();
}

function disconnect() {
  post({ type: 'clear-token' });
  Object.assign(state, { token: null, login: null, issues: [], issuesLoaded: false });
  render();
}

// ── 제출 ──

/** 이어서 기록할 이슈 — 고른 프레임이 든 열린 이슈 중 가장 최근 것. 없거나 "새 이슈로"면 null */
function continueIssue() {
  if (state.forceNew) return null;
  return openMatches()[0] || null;
}

function context() {
  const description = document.getElementById('description').value;
  return {
    fileKey: state.fileKey,
    fileName: state.fileName,
    pageName: state.pageName,
    targets: state.targets,
    typeId: state.typeId,
    summary: summaryOf(description),
    description,
    author: state.author,
  };
}

async function submit() {
  const ctx = context();
  if (!ctx.targets.length) return fail('캔버스에서 프레임을 먼저 골라 주세요.');
  if (!ctx.description.trim()) return fail('무엇이 바뀌었는지 적어 주세요.');
  const target = continueIssue();
  state.busy = true;
  state.error = null;
  render();
  try {
    if (!target) {
      const created = await gh(`${repoPath}/issues`, { method: 'POST', body: buildIssue(ctx) });
      state.result = { url: created.html_url, text: `#${created.number} 이슈를 만들었어요` };
    } else {
      const number = target.number;
      const current = await gh(`${repoPath}/issues/${number}`);
      const comment = buildComment(ctx, current.body);
      const created = await gh(`${repoPath}/issues/${number}/comments`, {
        method: 'POST',
        body: { body: comment.body },
      });
      if (comment.newMarkers.length) {
        await gh(`${repoPath}/issues/${number}`, {
          method: 'PATCH',
          body: { body: `${current.body || ''}\n${comment.newMarkers.join('\n')}` },
        });
      }
      await gh(`${repoPath}/issues/${number}/labels`, {
        method: 'POST',
        body: { labels: [comment.label] },
      });
      state.result = { url: created.html_url, text: `#${number}에 이어서 기록했어요` };
    }
    document.getElementById('description').value = '';
    state.typeTouched = false;
    state.typeId = suggestType(state.targets, state.fileKey);
    post({ type: 'notify', text: state.result.text });
    loadIssues();
  } catch (e) {
    state.error = e.message;
    if (e.status === 401) disconnect();
  }
  state.busy = false;
  render();
}

function fail(text) {
  state.error = text;
  render();
}

// ── 화면 ──

function esc(text) {
  return String(text == null ? '' : text).replace(
    /[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
  );
}

function matches() {
  if (!state.fileKey) return [];
  return matchIssues(
    state.issues,
    state.fileKey,
    state.targets.map((t) => t.id),
  );
}

function openMatches() {
  return matches().filter((i) => i.state === 'open');
}

function show(id, visible) {
  document.getElementById(id).hidden = !visible;
}

function setHtml(id, html) {
  document.getElementById(id).innerHTML = html;
}

function render() {
  const connected = Boolean(state.token && state.login);
  show('view-connect', !connected);
  show('view-file', connected && !state.fileKey);
  show('view-main', connected && Boolean(state.fileKey));
  document.getElementById('connect-error').textContent = connected ? '' : state.error || '';
  document.getElementById('connect-button').disabled = state.busy;
  if (!connected || !state.fileKey) return;

  renderCard();
  const has = state.targets.length > 0;
  show('form', has);

  setHtml(
    'types',
    CHANGE_TYPES.map(
      (t) =>
        `<button class="chip${state.typeId === t.id ? ' on' : ''}" data-type="${t.id}" title="${esc(t.hint)}">${esc(t.short)}</button>`,
    ).join(''),
  );

  const target = continueIssue();
  const open = openMatches()[0];
  if (target) {
    setHtml(
      'target',
      `<b>#${target.number}</b> 이슈에 이어서 기록돼요 · <a href="#" data-action="new">새 이슈로</a>`,
    );
  } else if (open) {
    setHtml(
      'target',
      `새 이슈로 만들어요 · <a href="#" data-action="continue">#${open.number}에 이어서 쓰기</a>`,
    );
  } else {
    setHtml('target', ''); // 이어 쓸 이슈가 없으면 버튼 문구(이슈 만들기)로 충분하다
  }

  const submitButton = document.getElementById('submit');
  submitButton.disabled = state.busy || !has;
  submitButton.textContent = state.busy
    ? '보내는 중…'
    : target
      ? `#${target.number}에 이어서 기록`
      : '이슈 만들기';

  document.getElementById('error').textContent = state.error || '';
  setHtml(
    'done',
    state.result
      ? `<div class="done">✓ ${esc(state.result.text)} · <a href="#" data-url="${esc(state.result.url)}">보기</a></div>`
      : '',
  );

  renderHistory();
  const known = isKnownFile(state.fileKey);
  setHtml(
    'who',
    `@${esc(state.login)}${known ? '' : ' · <span class="warn">테스트 파일(테스트 라벨)</span>'}`,
  );
}

function renderCard() {
  if (!state.targets.length) {
    setHtml(
      'card',
      '<div class="card empty"><div class="frame">캔버스에서 프레임을 골라 주세요</div>' +
        '<div class="muted meta">안쪽 레이어를 골라도 돼요. 여러 개를 고르면 이슈 하나로 묶어요.</div></div>',
    );
    return;
  }
  const frames = state.targets
    .map(
      (t) =>
        `<div class="frame">${esc(t.name)}${
          t.devStatus ? `<span class="badge">${esc(devStatusText(t.devStatus))}</span>` : ''
        }</div>`,
    )
    .join('');
  const sections = state.targets[0].sections;
  const where = [state.fileName, state.pageName].concat(sections).join(' › ');
  setHtml('card', `<div class="card">${frames}<div class="muted meta">${esc(where)}</div></div>`);
}

function renderHistory() {
  const box = document.getElementById('history-box');
  box.hidden = !state.targets.length;
  if (!state.targets.length) return;
  if (state.issuesError) {
    setHtml('history-summary', `<span class="error">이력을 불러오지 못했어요</span>`);
    setHtml('history', `<li class="error">${esc(state.issuesError)}</li>`);
    return;
  }
  if (!state.issuesLoaded) {
    setHtml('history-summary', '이력 불러오는 중…');
    setHtml('history', '');
    return;
  }
  const list = matches();
  const openCount = list.filter((i) => i.state === 'open').length;
  setHtml(
    'history-summary',
    list.length
      ? `이 프레임 이슈 ${list.length}개 (열림 ${openCount}) · <a href="#" data-action="refresh">새로고침</a>`
      : `이 프레임으로 만든 이슈가 없어요 · <a href="#" data-action="refresh">새로고침</a>`,
  );
  setHtml(
    'history',
    list
      .map(
        (i) =>
          `<li><span class="badge ${i.state}">${i.state === 'open' ? '열림' : '닫힘'}</span> ` +
          `<a href="#" data-url="${esc(i.url)}">#${i.number}</a> ${esc(i.title)} ` +
          `<span class="muted">${esc(i.createdAt.slice(0, 10))}</span></li>`,
      )
      .join(''),
  );
}

// ── 이벤트 ──

document.getElementById('open-token-page').onclick = () => openUrl(tokenUrl());
document.getElementById('connect-button').onclick = () => {
  const token = document.getElementById('token').value.trim();
  if (token) connect(token);
};
document.getElementById('disconnect').onclick = disconnect;
document.getElementById('file-save').onclick = () => {
  const key = parseFileKey(document.getElementById('file-link').value);
  if (!key) {
    document.getElementById('file-error').textContent = 'Figma 파일 링크가 아니에요.';
    return;
  }
  state.fileKey = key;
  post({ type: 'save-file-key', fileKey: key });
  render();
};
document.getElementById('submit').onclick = submit;
document.getElementById('description').addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) submit();
});
document.getElementById('description').addEventListener('input', () => {
  if (state.result || state.error) {
    state.result = null;
    state.error = null;
    render();
  }
});

// UI 안의 링크는 모두 href="#"이다. 기본 동작을 두면 iframe이 부모 주소로 이동해 플러그인 화면이 사라진다
document.addEventListener('click', (event) => {
  const chip = event.target.closest('[data-type]');
  if (chip) {
    state.typeId = chip.dataset.type;
    state.typeTouched = true;
    render();
    return;
  }
  const link = event.target.closest('a');
  if (!link) return;
  event.preventDefault();
  const action = link.dataset.action;
  if (action === 'new' || action === 'continue') {
    state.forceNew = action === 'new';
    render();
  } else if (action === 'refresh') {
    state.issuesLoaded = false;
    render();
    loadIssues();
  } else if (link.dataset.url) {
    openUrl(link.dataset.url);
  }
});

render();

})();
    </script>
  </body>
</html>
